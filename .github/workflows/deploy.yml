# Build, test and (on main only) deploy the static site to the existing gh-pages branch.
#
# - Pull requests: install, type check, lint, format check, build, unit/build-output tests,
#   Playwright e2e + axe. Uploads dist/ as an artifact. Never deploys.
# - Push to main / manual run: the same verification, then the deploy gate
#   (`npm run check:deploy`, which fails while owner content such as the Impressum address
#   is missing), then publishes the *tested* dist/ to gh-pages as a normal new commit
#   (no force-push, history kept). GitHub Pages keeps serving gh-pages / root.
name: Build, test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24.22.0'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          # The publish step authenticates with its own token; don't leave one in .git/config.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Content preservation and build-output tests
        run: npm test

      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload site
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-dist
          path: dist/
          include-hidden-files: true # keeps .nojekyll
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to gh-pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job may write to the repository.
    permissions:
      contents: write
    # Never run two deploys at once; queue instead of cancelling a running deploy.
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          # The publish step authenticates with its own token; don't leave one in .git/config.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the tested site
        uses: actions/download-artifact@v8.0.2
        with:
          name: site-dist
          path: dist/

      - name: Deploy gate (fails on missing owner content)
        run: npm run check:deploy

      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          # A normal commit on top of the existing gh-pages history; files that are not
          # in dist/ (the old Flutter build) are removed in that commit, not by rewriting history.
          keep_files: false
          force_orphan: false
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          full_commit_message: 'deploy: ${{ github.sha }}'
